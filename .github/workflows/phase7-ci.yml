name: Phase 7 CI

on:
  push:
    branches: [main, phase-7-grounded-knowledge-foundation]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run Phase 7 tests
        run: python -m pytest tests/phase-7 -q
