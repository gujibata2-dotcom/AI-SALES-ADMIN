name: customer-runtime
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-199-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q app
      - name: 199 runtime tests
        run: python -m unittest discover -s tests/customer_runtime -p 'test_*.py' -v
